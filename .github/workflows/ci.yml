name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cp .env.example .env
      - run: docker compose -f infra/compose.dev.yml config --quiet
      - run: pnpm db:setup
      - run: pnpm db:empty-check
      - run: pnpm db:restore-check
      - run: pnpm db:migrate
      - run: pnpm db:provision
      - run: pnpm test:auth-integration
      - run: pnpm test:workspaces-integration
      - run: pnpm test:integration
      - run: pnpm db:permissions
      - run: bash -n scripts/deploy.sh scripts/deploy-ssh-entrypoint.sh
      - run: docker build -f infra/Dockerfile.api -t windops-api:ci .
      - run: docker build -f infra/Dockerfile.web -t windops-web:ci .
      - name: Verify migration packaged in runtime image
        run: >-
          docker run --rm --network windops-dev_default --env-file .env
          -e MIGRATION_DATABASE_URL=postgresql://windops_migrator:windops_migrator_dev@postgres:5432/windops
          -e ELECTRIC_URL=http://electric:3000
          windops-api:ci node dist/platform/database/migrate.js
      - name: Validate Caddy runtime image
        run: docker run --rm -e APP_DOMAIN=localhost windops-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - if: always()
        run: docker compose -f infra/compose.dev.yml down -v
